##### ─── Plugin Manager ─────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'                         # TPM: Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tmux-sensible'               # Sensible default settings

##### ─── Session Auto-Save and Restore ──────────────────────────────────────
set -g @plugin 'tmux-plugins/tmux-resurrect'              # Save/restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'              # Auto-save/auto-restore sessions

set -g @continuum-restore 'on'                            # Restore sessions automatically on tmux start
set -g @continuum-save-interval '10'                      # Save sessions every 10 minutes

bind r source-file ~/.tmux.conf \; display "Config reloaded!"  # Reload config manually

##### ─── Terminal & Mouse ───────────────────────────────────────────────────
set-option -sa terminal-overrides ",xterm*:Tc"            # Enable 24-bit true color
set -g mouse on                                           # Enable mouse for panes, resizing, and scrolling

##### ─── Optional Prefix Key Change ─────────────────────────────────────────
# unbind C-b                                              # Unbind default prefix (Ctrl+b)
# set -g prefix C-Space                                   # Use Ctrl+Space as new prefix
# bind C-Space send-prefix                                # Send prefix manually with new key

##### ─── Vim-Style Pane Navigation ──────────────────────────────────────────
bind h select-pane -L                                     # Move to left pane
bind j select-pane -D                                     # Move to bottom pane
bind k select-pane -U                                     # Move to top pane
bind l select-pane -R                                     # Move to right pane

##### ─── Pane & Window Indexing ─────────────────────────────────────────────
set -g base-index 1                                       # Start windows at index 1
set -g pane-base-index 1                                  # Start panes at index 1
set-window-option -g pane-base-index 1                    # Ensure consistency
set-option -g renumber-windows on                         # Renumber windows on close

##### ─── Pane/Window Navigation Without Prefix ──────────────────────────────
bind -n M-Left select-pane -L                             # Alt + Left to move left
bind -n M-Right select-pane -R                            # Alt + Right to move right
bind -n M-Up select-pane -U                               # Alt + Up to move up
bind -n M-Down select-pane -D                             # Alt + Down to move down

bind -n S-Left previous-window                            # Shift + Left to previous window
bind -n S-Right next-window                               # Shift + Right to next window

bind -n M-H previous-window                               # Alt + Shift + H to previous window
bind -n M-L next-window                                   # Alt + Shift + L to next window

##### ─── Theme and Appearance ───────────────────────────────────────────────
set -g @catppuccin_flavour 'mocha'                        # Catppuccin theme: mocha flavor

##### ─── Additional Plugins ─────────────────────────────────────────────────
set -g @plugin 'christoomey/vim-tmux-navigator'           # Seamless Vim ↔ tmux pane navigation
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'          # Catppuccin theme plugin
set -g @plugin 'tmux-plugins/tmux-yank'                   # Yank text to system clipboard

##### ─── Copy Mode (Vi Style) ───────────────────────────────────────────────
set-window-option -g mode-keys vi                         # Use vi keys in copy mode

bind-key -T copy-mode-vi v send-keys -X begin-selection          # Start selection (v)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle       # Block select (Ctrl+v)
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel # Yank selection and exit (y)

##### ─── Pane Splitting in Same Directory ───────────────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"        # Split horizontally in same dir
bind % split-window -h -c "#{pane_current_path}"          # Split vertically in same dir

##### ─── Initialize TPM ─────────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'                             # Load TPM plugin manager